name: Publish learning content

on:
  workflow_dispatch:
    inputs:
      version:
        description: "内容版本，例如 1.0.0；每次发布必须使用新版本"
        required: true
        default: "1.3.0"

permissions:
  contents: write

concurrency:
  group: learning-content-release
  cancel-in-progress: false

jobs:
  validate-build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate JSON and build release assets
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: python scripts/build_release.py

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: content-v${{ inputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Please run again with a new version."
            exit 1
          fi

          gh release create "$TAG" dist/* \
            --title "Talkami learning content $TAG" \
            --generate-notes
